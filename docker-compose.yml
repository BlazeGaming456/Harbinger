services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: harbinger
      POSTGRES_PASSWORD: harbinger_dev
      POSTGRES_DB: harbinger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbinger"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

