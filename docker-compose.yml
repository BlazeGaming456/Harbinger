services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    volumes:
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "3000:3000"
  
  scheduler:
    build:
      context: .
      dockerfile: src/scheduler/Dockerfile
    volumes:
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env

  probe-worker:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    volumes:
      - ./src:/app/src
    command: node src/worker/probe-worker.js
    depends_on:
      redis: { condition: service_healthy }
    env_file: .env

  score-worker:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    volumes:
      - ./src:/app/src
    command: node src/worker/score-worker.js
    depends_on:
      redis: { condition: service_healthy }
    env_file: .env

  alert-worker:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    volumes:
      - ./src:/app/src
    command: node src/worker/alert-worker.js
    depends_on:
      redis: { condition: service_healthy }
    env_file: .env
