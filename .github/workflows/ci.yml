name: CI

on:
  push:
  pull_request:

jobs:
  worker-tests:
    runs-on: ubuntu-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: Install worker dependencies
      working-directory: ./src/worker
      run: npm install
    
    - name: Run worker tests
      working-directory: ./src/worker
      run: npm test
